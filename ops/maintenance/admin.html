<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>后台正在维护 · GINGTTO</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f3f6fa;color:#14243c;font:16px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    main{width:min(100%,456px);padding:32px;background:#fff;border:1px solid #dce5f1;border-radius:22px;box-shadow:0 16px 48px #13264312}
    .brand{font-size:.82rem;font-weight:750;letter-spacing:.11em;color:#30558a}
    h1{margin:15px 0 8px;font-size:clamp(24px,6vw,30px);line-height:1.3}
    p{margin:0 0 23px;color:#455c78}
    a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:10px;background:#2458d8;color:#fff;font-weight:650;text-decoration:none}
    a:focus-visible{outline:3px solid #172f60;outline-offset:4px}
  </style>
</head>
<body>
  <main aria-labelledby="maintenance-title">
    <div class="brand">GINGTTO · 管理后台</div>
    <h1 id="maintenance-title">后台正在维护</h1>
    <p>系统正在更新，预计几分钟内恢复。请稍后刷新页面继续使用。</p>
    <a href="">刷新页面</a>

</html>

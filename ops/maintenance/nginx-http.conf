# http-context maps; APIs and assets must never receive an HTML error document.
map "$request_method:$http_accept" $gingtto_maintenance_document {
    default @gingtto_maintenance;
    ~*^(GET|HEAD):.*text/html @gingtto_maintenance_html;
}
map $request_uri $gingtto_maintenance_target {
    ~^/index\.html(?:\?|$) $gingtto_maintenance_document;
    ~^/(?:api(?:/|\?|$)|assets/|uploads/|files/|__) @gingtto_maintenance;
    ~\.[^/?]+(?:\?|$) @gingtto_maintenance;
    default $gingtto_maintenance_document;
}
map $host $gingtto_maintenance_root {
    default /var/www/gingtto-store-maintenance;
    admin.gingtto.store /var/www/gingtto-admin-maintenance;
    office.gingtto.store /var/www/gingtto-admin-maintenance;
    admin.smawell.shop /var/www/gingtto-admin-maintenance;
}

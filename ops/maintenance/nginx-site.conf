# Included by both the main and office HTTPS security site snippets.
error_page 503 =503 $gingtto_maintenance_target;

location @gingtto_maintenance {
    types { }
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Retry-After 30 always;
    add_header X-Gingtto-Maintenance 1 always;
    include /etc/nginx/snippets/gingtto-security-response-headers.conf;
    return 503 '{"code":"maintenance","message":"Maintenance in progress. Please try again shortly."}';
}

location @gingtto_maintenance_html {
    types { }
    root $gingtto_maintenance_root;
    try_files /index.html =503;
    default_type text/html;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Retry-After 30 always;
    add_header X-Gingtto-Maintenance 1 always;
    include /etc/nginx/snippets/gingtto-security-response-headers.conf;
}

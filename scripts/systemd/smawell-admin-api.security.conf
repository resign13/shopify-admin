# Install as /etc/systemd/system/smawell-admin-api.service.d/security.conf only
# during the approved cutover. Runtime configurations have separate groups.
[Service]
User=gingtto-admin
Group=gingtto-admin
WorkingDirectory=/opt/smawell/current/admin/admin-backend
EnvironmentFile=
EnvironmentFile=/etc/gingtto/runtime/admin.env
EnvironmentFile=/etc/gingtto/runtime/admin.security.env
Environment=
Environment=PYTHONDONTWRITEBYTECODE=1
PassEnvironment=
UnsetEnvironment=
ExecStart=
ExecStart=/opt/smawell/current/admin/admin-backend/.venv/bin/gunicorn --config gunicorn.conf.py app:app
UMask=0027
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
# Legacy uploads remain writable until the separately approved media cutover.
ReadWritePaths=
ReadWritePaths=/opt/smawell/shopify-admin/admin-backend/data /opt/smawell/shopify-admin/admin-backend/uploads /opt/smawell/private-files/admin
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
MemoryMax=1G
TasksMax=128
Restart=on-failure

# Install as /etc/systemd/system/smawell-store-api.service.d/security.conf only
# during the approved cutover. The store reads, but does not write, admin files.
[Service]
User=gingtto-store
Group=gingtto-store
WorkingDirectory=/opt/smawell/current/store/storefront-backend
EnvironmentFile=
EnvironmentFile=/etc/gingtto/runtime/store.env
EnvironmentFile=/etc/gingtto/runtime/store.security.env
Environment=
Environment=PYTHONDONTWRITEBYTECODE=1
PassEnvironment=
UnsetEnvironment=
ExecStart=
ExecStart=/opt/smawell/current/store/storefront-backend/.venv/bin/gunicorn --config gunicorn.conf.py app:app
UMask=0027
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=
ReadWritePaths=/opt/smawell/shopify/storefront-backend/data /opt/smawell/shopify/storefront-backend/uploads /opt/smawell/private-files/store
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
MemoryMax=1G
TasksMax=128
Restart=on-failure

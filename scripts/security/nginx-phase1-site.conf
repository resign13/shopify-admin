# PHASE ONE ONLY: private attachments and login-protection section 6.4 deferred.
# Include in each verified HTTPS virtual host; replace the upstream variable with
# 127.0.0.1:5302 (admin) or the verified storefront port 127.0.0.1:5301.
# The public origin firewall must accept only Cloudflare networks plus the
# separately restricted maintenance source. Cloudflare SSL mode: Full (strict).
client_max_body_size 40m;
client_body_timeout 20s;
limit_conn gingtto_connections 20;
include /etc/nginx/snippets/gingtto-security-response-headers.conf;
access_log /var/log/nginx/gingtto-access.log gingtto_sanitized;
# Avoid raw query strings in routine nginx error messages; status/duration and
# application security audits provide the operational record.
error_log /var/log/nginx/gingtto-errors.log crit;

location ~ ^/api/internal/ {
    include /etc/nginx/snippets/gingtto-security-response-headers.conf;
    add_header Cache-Control no-store always;
    return 404;
}
location ~ ^/api/public/ {
    include /etc/nginx/snippets/gingtto-security-response-headers.conf;
    add_header Cache-Control no-store always;
    return 410;
}
location ~ ^/api/auth/((admin|store)/)?login$ {
    limit_req_status 429;
    error_page 429 = @gingtto_rate_limited;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_pass http://$gingtto_upstream;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location ^~ /api/external/ {
    limit_req zone=gingtto_external_ip burst=5 nodelay;
    limit_req zone=gingtto_external_global burst=10;
    limit_req_status 429;
    limit_conn gingtto_external_active 4;
    limit_conn_status 429;
    error_page 429 = @gingtto_external_rate_limited;
    include /etc/nginx/snippets/gingtto-security-response-headers.conf;
    add_header Cache-Control no-store always;
    add_header Vary Authorization always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_pass http://$gingtto_upstream;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_read_timeout 30s;
}
location @gingtto_external_rate_limited {
    default_type application/json;
    include /etc/nginx/snippets/gingtto-security-response-headers.conf;
    add_header Cache-Control no-store always;
    add_header Vary Authorization always;
    add_header Retry-After 1 always;
    add_header X-Request-Id $request_id always;
    return 429 '{"code":"rate_limited","message":"Too many requests. Try again shortly.","requestId":"$request_id"}';
}
location /api/ {
    limit_req zone=gingtto_query burst=30 nodelay;
    limit_req_status 429;
    error_page 429 = @gingtto_rate_limited;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_pass http://$gingtto_upstream;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_read_timeout 120s;
}
# Legacy uploads and image-host virtual hosts are deliberately NOT replaced.
# Keep their verified pre-cutover locations/cache/redirect behavior in each site.
location @gingtto_rate_limited {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Retry-After 5 always;
    include /etc/nginx/snippets/gingtto-security-response-headers.conf;
    return 429 '{"code":"rate_limited","message":"Too many requests. Try again later."}';
}
error_page 503 = @gingtto_maintenance;
location @gingtto_maintenance {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Retry-After 60 always;
    include /etc/nginx/snippets/gingtto-security-response-headers.conf;
    return 503 '{"code":"maintenance","message":"Maintenance in progress. Please try again shortly."}';
}
# Use a sanitized access log without $request, $args, Cookie or Referer. Retain
# aggregated metrics for 30 days; keep security events in PostgreSQL for 90 days.

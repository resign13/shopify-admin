# PHASE ONE: retain image-host virtual hosts unchanged.
# Include in nginx's http context, after installing the verified Cloudflare IP
# ranges from https://www.cloudflare.com/ips/ (IPv4 AND IPv6).
# real_ip_header CF-Connecting-IP;
# real_ip_recursive on;
# include /etc/nginx/snippets/cloudflare-trusted-peers.conf;
limit_req_zone $binary_remote_addr zone=gingtto_query:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gingtto_connections:10m;
map $uri $gingtto_external_api_scope {
    default "";
    ~^/api/external/ "external-read-all-aliases";
}
limit_req_zone $gingtto_external_api_scope zone=gingtto_external_global:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gingtto_external_ip:1m rate=5r/s;
limit_conn_zone $gingtto_external_api_scope zone=gingtto_external_active:1m;
server_tokens off;

# Default unknown-host listener; existing approved names must be explicit in the
# actual virtual hosts. Do not proxy unmatched requests to an application.
server { listen 80 default_server; listen [::]:80 default_server; server_name _; return 444; }
server {
    listen 80;
    server_name gingtto.store www.gingtto.store api.gingtto.store admin.gingtto.store api-admin.gingtto.store smawell.shop www.smawell.shop api.smawell.shop admin.smawell.shop api-admin.smawell.shop;
    location /api/ { add_header Cache-Control no-store always; return 426; }
    location / { return 308 https://$host$request_uri; }
}

log_format gingtto_sanitized '$time_iso8601 method=$request_method status=$status duration=$request_time upstream=$upstream_response_time';
# Each virtual host should use: access_log /var/log/nginx/gingtto-access.log gingtto_sanitized;

# Populate both includes from verified official ranges using prepare-proxy-config.py.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
include /etc/nginx/snippets/cloudflare-trusted-peers.conf;
# Critically, source admission uses the ORIGINAL connection peer, not the
# client address rewritten by real_ip. Ops addresses are admission-only.
geo $realip_remote_addr $gingtto_origin_peer_allowed {
    default 0;
    include /etc/nginx/snippets/cloudflare-origin-peers.conf;
}

# Include in nginx's http context, after installing the verified Cloudflare IP
# ranges from https://www.cloudflare.com/ips/ (IPv4 AND IPv6).
# real_ip_header CF-Connecting-IP;
# real_ip_recursive on;
# include /etc/nginx/snippets/cloudflare-trusted-peers.conf;
limit_req_zone $binary_remote_addr zone=gingtto_query:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gingtto_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=gingtto_connections:10m;
server_tokens off;

# Default unknown-host listener; existing approved names must be explicit in the
# actual virtual hosts. Do not proxy unmatched requests to an application.
server { listen 80 default_server; listen [::]:80 default_server; server_name _; return 444; }
server {
    listen 80;
    server_name gingtto.store www.gingtto.store api.gingtto.store admin.gingtto.store api-admin.gingtto.store img.gingtto.store smawell.shop www.smawell.shop api.smawell.shop admin.smawell.shop api-admin.smawell.shop img.smawell.shop;
    location /api/ { return 426; }
    location / { return 308 https://$host$request_uri; }
}

log_format gingtto_sanitized '$time_iso8601 method=$request_method status=$status duration=$request_time upstream=$upstream_response_time';
# Each virtual host should use: access_log /var/log/nginx/gingtto-access.log gingtto_sanitized;

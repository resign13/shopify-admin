add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.gingtto.store https://img.smawell.shop https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://img.gingtto.store https://img.smawell.shop https://res.cloudinary.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/security/csp-report" always;

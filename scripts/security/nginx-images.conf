# Approved image virtual hosts only; Host is explicitly allowed by storefront.
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
access_log /var/log/nginx/gingtto-access.log gingtto_sanitized;
error_log /var/log/nginx/gingtto-errors.log crit;
location /media/products/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_pass http://127.0.0.1:5301;
}
location /uploads/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_pass http://127.0.0.1:5301;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location / { return 404; }

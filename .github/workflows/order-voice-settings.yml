name: Order Voice Settings
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit server delivery switch (accounts remain opt-in)
        type: choice
        required: true
        default: disable
        options: [enable, disable]
permissions:
  contents: read
concurrency:
  group: admin-production
  cancel-in-progress: false
jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure through the bounded non-root SSH channel
        env:
          DEPLOY_HOST: ${{ secrets.SECURITY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SECURITY_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SECURITY_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SECURITY_DEPLOY_KNOWN_HOSTS }}
          VOICE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$VOICE_MODE" in enable|disable) ;; *) exit 1;; esac
          test "$DEPLOY_USER" = gingtto-deploy
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
          trap 'rm -f -- "$RUNNER_TEMP/deploy-key"' EXIT
          opts=(-i "$RUNNER_TEMP/deploy-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/deploy-known-hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15)
          audio_hash=$(python -c 'import json; print(json.load(open("frontend/src/assets/new-order-zh-CN.json"))["wavSha256"])')
          [[ "$audio_hash" =~ ^[a-f0-9]{64}$ ]]
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n /usr/local/sbin/gingtto-release voice '$VOICE_MODE' '$audio_hash'"

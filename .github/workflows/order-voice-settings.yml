name: Order Voice Settings
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit server delivery switch (accounts remain opt-in)
        type: choice
        required: true
        default: disable
        options: [enable, disable]
permissions:
  contents: read
concurrency:
  group: admin-production
  cancel-in-progress: false
jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure and verify the deployed server over verified SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VOICE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$VOICE_MODE" in enable|disable) ;; *) exit 1;; esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          umask 077
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
          opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/deploy-known-hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15)
          sshpass -e ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$VOICE_MODE" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          mode="$1"
          root=/opt/smawell/shopify-admin
          exec 9>/var/lock/smawell-deploy.lock
          flock -w 120 9
          cd "$root/admin-backend"
          .venv/bin/python "$root/scripts/verify-order-notifications.py"
          if [ "$mode" = enable ]; then
            test -n "$(find "$root/frontend/dist/assets" -maxdepth 1 -name 'new-order-zh-CN-*.wav' -print -quit)"
            trap '.venv/bin/python "$root/scripts/configure-order-voice.py" disable --env "$root/admin-backend/.env"; systemctl restart smawell-admin-api' ERR
          fi
          .venv/bin/python "$root/scripts/configure-order-voice.py" "$mode" --env "$root/admin-backend/.env"
          systemctl restart smawell-admin-api
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5302/api/health >/dev/null; then break; fi
            sleep 2
          done
          systemctl is-active --quiet smawell-admin-api
          .venv/bin/python "$root/scripts/verify-order-notifications.py" --http --expect-enabled "$mode"
          systemctl is-active --quiet smawell-order-notification-cleanup.timer
          trap - ERR
          echo 'Server delivery settings and live HTTP checks passed.'
          REMOTE

name: Encrypted Local Database Sync
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-database-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read-only snapshot and local-key encryption
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python .github/export-local-db.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-local-db
          path: database.enc
          retention-days: 1
          if-no-files-found: error

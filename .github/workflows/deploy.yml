name: Deploy Admin
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: admin-${{ github.event.pull_request.number || 'production' }}
  # Superseded PRs stop wasting runners; production is never auto-cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reuse:
    # PRs and manual runs always execute the full verification suite.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.resolve.outputs.reused == 'true' && steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Find the exact successful PR tree and verified build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ci/reuse_verified.py resolve
      - name: Share verified PR build in this run
        if: steps.resolve.outputs.reused == 'true'
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: ${{ runner.temp }}/reused-frontend
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  build:
    needs: reuse
    if: ${{ always() && !cancelled() && needs.reuse.outputs.reused != 'true' }}
    outputs:
      frontend_artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
      - name: Order quantity selection unit tests
        working-directory: frontend
        run: node --test tests/exportDownload.test.js src/utils/adminErrors.test.js src/utils/orderSelection.test.js src/utils/orderFilters.test.js src/utils/apiIntegration.test.js src/utils/sizeChartUnits.test.js src/utils/tableSort.test.js src/utils/tableResize.test.js src/utils/apiIntegrationReads.test.js
      - name: Catalog ordering UI tests
        working-directory: frontend
        run: node --test src/utils/catalogOrder.test.js src/utils/customerTemplates.test.js src/utils/orderQuantities.test.js src/utils/orderPricing.test.js src/utils/orderOperations.test.js src/utils/orderReorder.test.js src/utils/orderNumber.test.js src/utils/inventoryStages.test.js src/utils/inventoryRegistrationUI.test.js src/utils/styleSalesperson.test.js src/utils/productWeights.test.js src/utils/presale.test.js src/utils/finance.test.js src/notifications/notifications.test.js src/notifications/authSession.test.js src/notifications/cookieTransport.test.js src/notifications/audioAsset.test.js
      - name: Build shared frontend
        working-directory: frontend
        run: npm run build
      - name: Share candidate build; deployment requires every check
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: frontend/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  backend:
    needs: reuse
    if: ${{ always() && !cancelled() && needs.reuse.outputs.reused != 'true' }}
    env:
      APP_ENV: test
      DB_SCHEMA_AUTO_MIGRATE: '1'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gingtto_workbench_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: admin-backend/requirements.txt
      - run: pip install pip-audit==2.10.1 -r admin-backend/requirements.txt
      - name: Validate deployment script syntax
        run: bash -n scripts/deploy-admin.sh
      - name: Dependency and credential checks
        run: |
          python -m pip_audit -r admin-backend/requirements.txt
          python scripts/security-secret-scan.py
      - name: Phase-one proxy boundary acceptance (isolated container)
        run: |
          python -m unittest discover -s scripts/security -p 'test_*.py' -v
          python scripts/security/verify_proxy_phase1.py --output "$RUNNER_TEMP/security-proxy-phase1"
          docker run --rm --network none --cap-add SYS_PTRACE -e SECURITY_RELEASE_FIXTURE=1 --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/security,dst=/fixture,readonly" python:3.12-slim python /fixture/test_release_control_linux.py
      - name: Dedicated-key SSH, restricted sudo and systemd parser (isolated container)
        run: |
          docker build --tag gingtto-security-runtime-fixture --file scripts/security/test_runtime.Dockerfile scripts/security
          docker run --rm --network none -e SECURITY_INSTALL_FIXTURE=1 --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/security,dst=/fixture,readonly" --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/systemd,dst=/fixture-units,readonly" gingtto-security-runtime-fixture
      - name: Release configuration tests
        run: |
          python -m unittest discover -s scripts -p test_order_voice_settings.py -v
          python -m unittest discover -s .github/ci -p 'test_*.py' -v
      - name: Isolated inventory, permissions, transactions and image tests
        working-directory: admin-backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_workbench_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: python ../scripts/verify-security-regression.py && python ../scripts/verify-product-weights.py admin-backend && python ../scripts/verify-style-catalog.py admin-backend
      - name: Metadata-only retention roles and native backup restore acceptance
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_workbench_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          python scripts/verify-security-aux-roles.py --expected-db gingtto_workbench_test --prefix gingtto_ci_aux_test
          docker pull postgres:16
          python scripts/security/verify_native_restore.py --isolated-fixture --report "$RUNNER_TEMP/native-restore.json"
  browsers:
    env:
      APP_ENV: test
      DB_SCHEMA_AUTO_MIGRATE: '1'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gingtto_workbench_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    needs: [reuse, build]
    if: ${{ always() && !cancelled() && needs.reuse.outputs.reused != 'true' && needs.build.result == 'success' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [orders, operations, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: admin-backend/requirements.txt
      - run: pip install pip-audit==2.10.1 -r admin-backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Separate cache from build: this runner installs only the CLI.
          cache-dependency-path: .github/ci/playwright/package-lock.json
      - name: Restore candidate build from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: verified-frontend
          path: frontend/dist
      - name: Prepare browser once per runner
        run: |
          mkdir -p output/playwright
          npm ci --prefix .github/ci/playwright --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/ci/playwright/node_modules/.bin" >> "$GITHUB_PATH"
          .github/ci/playwright/node_modules/.bin/playwright-cli install-browser chrome
      - name: Build and verify browser voice lifecycle on an isolated fixture
        if: matrix.suite == 'orders'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_voice_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          python scripts/voice-browser-fixture.py > "$RUNNER_TEMP/voice-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5358/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/voice-browser.log"; exit 1; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:5358/api/health >/dev/null; then cat "$RUNNER_TEMP/voice-browser.log"; exit 1; fi
          mkdir -p output/playwright
          playwright-cli -s=voiceci open http://127.0.0.1:5358/login --browser chrome
          playwright-cli -s=voiceci run-code --filename scripts/login-voice-browser-fixture.js
          playwright-cli -s=voiceci run-code --filename scripts/verify-order-voice-browser.js | tee "$RUNNER_TEMP/voice-result.log"
          grep -q '"multiTabOnce":true' "$RUNNER_TEMP/voice-result.log"
          grep -q '"authTransportRetryRetainsEpisode":true' "$RUNNER_TEMP/voice-result.log"
          playwright-cli -s=voiceci close
      - name: Isolated login CAPTCHA and department permission lifecycle
        if: matrix.suite == 'orders'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_department_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
          SECURITY_ADMIN_CAPTCHA_ENABLED: '1'
        run: |
          set -euo pipefail
          python scripts/department-permissions-browser-fixture.py > "$RUNNER_TEMP/department-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5364/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/department-browser.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5364/api/health >/dev/null
          playwright-cli -s=departmentci open http://127.0.0.1:5364/login --browser chrome
          playwright-cli -s=departmentci snapshot
          playwright-cli -s=departmentci run-code --filename scripts/verify-login-captcha-browser.js | tee "$RUNNER_TEMP/captcha-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/captcha-result.log"; then exit 1; fi
          grep -q '"logoutRevokesSession":true' "$RUNNER_TEMP/captcha-result.log"
          playwright-cli -s=departmentci snapshot
          playwright-cli -s=departmentci run-code --filename scripts/verify-department-permissions-browser.js | tee "$RUNNER_TEMP/department-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/department-result.log"; then exit 1; fi
          grep -q '"extraGrantSavedAndPersisted":true' "$RUNNER_TEMP/department-result.log"
          playwright-cli -s=departmentci close
      - name: Isolated cumulative overdelivery browser lifecycle
        if: matrix.suite == 'operations'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_overdelivery_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          python scripts/overdelivery-browser-fixture.py > "$RUNNER_TEMP/overdelivery-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5359/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/overdelivery-browser.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5359/api/health >/dev/null
          playwright-cli -s=overdeliveryci open http://127.0.0.1:5359/login --browser chrome
          playwright-cli -s=overdeliveryci run-code --filename scripts/login-overdelivery-browser-fixture.js
          playwright-cli -s=overdeliveryci run-code --filename scripts/verify-inventory-registration-ui-browser.js | tee "$RUNNER_TEMP/inventory-ui-result.log"
          grep -q '"alignedInputs":true' "$RUNNER_TEMP/inventory-ui-result.log"
          grep -q '"narrowScreen":true' "$RUNNER_TEMP/inventory-ui-result.log"
          playwright-cli -s=overdeliveryci run-code --filename scripts/verify-inventory-overdelivery-browser.js | tee "$RUNNER_TEMP/overdelivery-result.log"
          grep -q '"accepted115":true' "$RUNNER_TEMP/overdelivery-result.log"
          grep -q '"spentQuotaNotRenewed":true' "$RUNNER_TEMP/overdelivery-result.log"
          python scripts/verify-inventory-overdelivery.py admin-backend
          playwright-cli -s=overdeliveryci close
      - name: Isolated product weights browser lifecycle
        if: matrix.suite == 'operations'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_weights_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          python scripts/weights-browser-fixture.py > "$RUNNER_TEMP/weights-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5360/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/weights-browser.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5360/api/health >/dev/null
          playwright-cli -s=weightsci open http://127.0.0.1:5360/login --browser chrome
          playwright-cli -s=weightsci run-code --filename scripts/login-weights-browser-fixture.js
          playwright-cli -s=weightsci run-code --filename scripts/verify-product-weights-browser.js | tee "$RUNNER_TEMP/weights-result.log"
          grep -q '"currentWeightRefresh":true' "$RUNNER_TEMP/weights-result.log"
          grep -q '"warehouseWeightWithoutMoney":true' "$RUNNER_TEMP/weights-result.log"
          playwright-cli -s=weightsci run-code --filename scripts/verify-order-ui-browser.js | tee "$RUNNER_TEMP/order-ui-result.log"
          grep -q '"dateAfterOrderNo":true' "$RUNNER_TEMP/order-ui-result.log"
          grep -q '"goodsSummaryPosition":true' "$RUNNER_TEMP/order-ui-result.log"
          grep -q '"warehouseReopenWithoutMoney":true' "$RUNNER_TEMP/order-ui-result.log"
          grep -q '"compactWeightHint":true' "$RUNNER_TEMP/order-ui-result.log"
          grep -q '"unsetWeightSmallFont":true' "$RUNNER_TEMP/order-ui-result.log"
          grep -q '"narrowWeightSummary":true' "$RUNNER_TEMP/order-ui-result.log"
          playwright-cli -s=weightsci run-code --filename scripts/verify-order-reorder-browser.js | tee "$RUNNER_TEMP/reorder-result.log"
          grep -q '"reorder":true' "$RUNNER_TEMP/reorder-result.log"
          playwright-cli -s=weightsci run-code --filename scripts/verify-order-drafts-browser.js | tee "$RUNNER_TEMP/drafts-result.log"
          grep -q '"drafts":true' "$RUNNER_TEMP/drafts-result.log"
          playwright-cli -s=weightsci run-code --filename scripts/verify-order-number-browser.js | tee "$RUNNER_TEMP/order-number-result.log"
          grep -q '"orderNumberUI":true' "$RUNNER_TEMP/order-number-result.log"
          playwright-cli -s=weightsci run-code --filename scripts/verify-partial-allocation-browser.js | tee "$RUNNER_TEMP/partial-allocation-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/partial-allocation-result.log"; then exit 1; fi
          grep -q '"partialAllocation": *true' "$RUNNER_TEMP/partial-allocation-result.log"
          playwright-cli -s=weightsci close
      - name: Isolated cancellation notes and current-stock browser lifecycle
        if: matrix.suite == 'orders'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_order_notes_stock_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          python scripts/order-notes-stock-browser-fixture.py > "$RUNNER_TEMP/order-notes-stock.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5360/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/order-notes-stock.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5360/api/health >/dev/null
          playwright-cli -s=notesstockci open http://127.0.0.1:5360/login --browser chrome
          playwright-cli -s=notesstockci run-code --filename scripts/login-weights-browser-fixture.js
          playwright-cli -s=notesstockci run-code --filename scripts/verify-order-cancel-note-browser.js | tee "$RUNNER_TEMP/cancel-note-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/cancel-note-result.log"; then exit 1; fi
          grep -q '"stockReturnedOnce":true' "$RUNNER_TEMP/cancel-note-result.log"
          playwright-cli -s=notesstockci run-code --filename scripts/verify-order-detail-stock-browser.js | tee "$RUNNER_TEMP/detail-stock-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/detail-stock-result.log"; then exit 1; fi
          grep -q '"cancelledNotDoubleReturned":true' "$RUNNER_TEMP/detail-stock-result.log"
          grep -q '"lateResponseIgnored":true' "$RUNNER_TEMP/detail-stock-result.log"
          playwright-cli -s=notesstockci close
      - name: Isolated order size and quantity selection lifecycle
        if: matrix.suite == 'orders'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_order_selection_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          python scripts/order-selection-browser-fixture.py > "$RUNNER_TEMP/order-selection.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5360/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/order-selection.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5360/api/health >/dev/null
          playwright-cli -s=selectionci open http://127.0.0.1:5360/login --browser chrome
          playwright-cli -s=selectionci run-code --filename scripts/login-weights-browser-fixture.js
          playwright-cli -s=selectionci run-code --filename scripts/verify-order-selection-browser.js | tee "$RUNNER_TEMP/order-selection-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/order-selection-result.log"; then exit 1; fi
          grep -q '"crossPageStaging":true' "$RUNNER_TEMP/order-selection-result.log"
          grep -q '"createDeductsOnce":true' "$RUNNER_TEMP/order-selection-result.log"
          grep -q '"zeroOnlyExplicitJoin":true' "$RUNNER_TEMP/order-selection-result.log"
          grep -q '"finishNeverAddsNewSku":true' "$RUNNER_TEMP/order-selection-result.log"
          playwright-cli -s=selectionci run-code --filename scripts/verify-order-selection-edit-browser.js | tee "$RUNNER_TEMP/order-selection-edit-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/order-selection-edit-result.log"; then exit 1; fi
          grep -q '"manualQuoteRetained":true' "$RUNNER_TEMP/order-selection-edit-result.log"
          grep -q '"fulfilledEdits":true' "$RUNNER_TEMP/order-selection-edit-result.log"
          grep -q '"cancelledLocked":true' "$RUNNER_TEMP/order-selection-edit-result.log"
          playwright-cli -s=selectionci run-code --filename scripts/verify-order-size-standards-browser.js | tee "$RUNNER_TEMP/order-size-standards-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/order-size-standards-result.log"; then exit 1; fi
          grep -q '"independentSizeRows":true' "$RUNNER_TEMP/order-size-standards-result.log"
          grep -q '"mixedDraftRestore":true' "$RUNNER_TEMP/order-size-standards-result.log"
          grep -q '"mainEditorIndependentSizes":true' "$RUNNER_TEMP/order-size-standards-result.log"
          grep -q '"zeroOnlyDraftRestore":true' "$RUNNER_TEMP/order-size-standards-result.log"
          playwright-cli -s=selectionci close
      - name: Isolated finance browser lifecycle
        if: matrix.suite == 'operations'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_finance_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          python scripts/finance-browser-fixture.py > "$RUNNER_TEMP/finance-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5362/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/finance-browser.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5362/api/health >/dev/null
          playwright-cli -s=financeci open http://127.0.0.1:5362/login --browser chrome
          playwright-cli -s=financeci run-code --filename scripts/login-finance-browser-fixture.js
          playwright-cli -s=financeci run-code --filename scripts/verify-finance-browser.js | tee "$RUNNER_TEMP/finance-result.log"
          grep -Eq '"financeBrowser":[[:space:]]*true' "$RUNNER_TEMP/finance-result.log"
          playwright-cli -s=financeci snapshot
          playwright-cli -s=financeci run-code --filename scripts/verify-finance-cost-ui-browser.js | tee "$RUNNER_TEMP/finance-ui-result.log"
          grep -Eq '"twoColumnLedger":[[:space:]]*true' "$RUNNER_TEMP/finance-ui-result.log"
          grep -Eq '"renderOnlyNoWrites":[[:space:]]*true' "$RUNNER_TEMP/finance-ui-result.log"
          playwright-cli -s=financeci close
      - name: Isolated cost Excel export and import lifecycle
        if: matrix.suite == 'operations'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_finance_excel_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
          SECURITY_LIMIT_EXPORT: '10000'
          SECURITY_LIMIT_UPLOAD: '10000'
        run: |
          set -euo pipefail
          python scripts/finance-browser-fixture.py --excel > "$RUNNER_TEMP/finance-excel-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5362/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/finance-excel-browser.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5362/api/health >/dev/null
          playwright-cli -s=financeexcelci open http://127.0.0.1:5362/login --browser chrome
          playwright-cli -s=financeexcelci run-code --filename scripts/login-finance-browser-fixture.js
          playwright-cli -s=financeexcelci run-code --filename scripts/verify-finance-cost-excel-browser.js | tee "$RUNNER_TEMP/finance-excel-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/finance-excel-result.log"; then exit 1; fi
          grep -Eq '"costExcelBrowser":[[:space:]]*true' "$RUNNER_TEMP/finance-excel-result.log"
          playwright-cli -s=financeexcelci close
      - name: Isolated machine-key management and read-only API browser acceptance
        if: matrix.suite == 'operations'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_api_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          python scripts/api-integrations-browser-fixture.py > "$RUNNER_TEMP/api-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5366/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/api-browser.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5366/api/health >/dev/null
          playwright-cli -s=apici open http://127.0.0.1:5366/login --browser chrome
          playwright-cli -s=apici run-code --filename scripts/login-api-integrations-browser-fixture.js
          playwright-cli -s=apici run-code --filename scripts/verify-api-integrations-browser.js | tee "$RUNNER_TEMP/api-browser-result.log"
          if grep -q '^### Error' "$RUNNER_TEMP/api-browser-result.log"; then exit 1; fi
          grep -q '"noPlaintextPersistence":true' "$RUNNER_TEMP/api-browser-result.log"
          grep -q '"committedResponseLossNotRetried":true' "$RUNNER_TEMP/api-browser-result.log"
          grep -q '"apiOnlyRoleIsolation":true' "$RUNNER_TEMP/api-browser-result.log"
          grep -q '"desktopAndMobile":true' "$RUNNER_TEMP/api-browser-result.log"
          playwright-cli -s=apici close
      - name: Isolated iPhone-sized admin layout and interactions
        if: matrix.suite == 'mobile'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_admin_mobile_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          python scripts/admin-mobile-browser-fixture.py > "$RUNNER_TEMP/admin-mobile.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5380/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/admin-mobile.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5380/api/health >/dev/null
          mkdir -p output/playwright
          # One admin login for this isolated fixture. The checks reuse its cookie
          # session; role checks log in only distinct accounts in new contexts.
          playwright-cli -s=mobileci open http://127.0.0.1:5380/login --browser chrome
          playwright-cli -s=mobileci run-code --filename scripts/login-admin-mobile-browser-fixture.js
          run_mobile_check() {
            local stage="$1"
            local result="$RUNNER_TEMP/$stage.log"
            playwright-cli -s=mobileci run-code --filename "scripts/$stage.js" | tee "$result"
            if grep -q '^### Error' "$result"; then return 1; fi
            # Match the top-level result, never nested successful assertions in
            # a {"passed":false,"checks":[{"passed":true}]} failure report.
            grep -Eq '^[[:space:]]*\{[[:space:]]*"passed"[[:space:]]*:[[:space:]]*true[[:space:]]*[,}]' "$result"
          }
          # Finance creates the dedicated finance account consumed by permissions.
          # Goods creates the wide chart used by the presentation-only matrix check.
          for stage in \
            verify-admin-chinese-browser \
            verify-admin-mobile-refined-finance-system-browser \
            verify-admin-mobile-refined-layout-browser \
            verify-admin-mobile-refined-orders-stock-browser \
            verify-admin-mobile-refined-goods-browser \
            verify-admin-mobile-refined-interactions-browser \
            verify-admin-mobile-refined-resilience-browser \
            verify-admin-mobile-refined-permissions-browser \
            verify-admin-mobile-search-browser \
            verify-order-mobile-polish-browser \
            verify-order-mobile-filters-browser \
            verify-order-detail-mobile-browser \
            verify-mobile-sort-sync-browser \
            verify-api-read-state-browser; do
            run_mobile_check "$stage"
          done
          playwright-cli -s=mobileci close
      - name: Isolated size chart edit, Excel import and preview lifecycle
        if: matrix.suite == 'operations'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: gingtto_size_charts_browser_test
          PGUSER: postgres
          PGPASSWORD: fixture-only-password
          SECURITY_ATTACHMENT_MODE: legacy
          SECURITY_LOGIN_PROTECTION_ENABLED: '0'
          SECURITY_LIMIT_EXPORT: '10000'
          SECURITY_LIMIT_UPLOAD: '10000'
        run: |
          set -euo pipefail
          python scripts/size-charts-browser-fixture.py > "$RUNNER_TEMP/size-charts-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5366/api/health >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/size-charts-browser.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5366/api/health >/dev/null
          playwright-cli -s=sizechartsci open http://127.0.0.1:5366/login --browser chrome
          for stage in login-size-charts-browser-fixture verify-size-charts-edit verify-size-charts-import verify-size-charts-boundaries verify-size-charts-preview verify-size-charts-units verify-size-charts-preview-units verify-size-charts-dimensions; do
            playwright-cli -s=sizechartsci run-code --filename "scripts/$stage.js" | tee "$RUNNER_TEMP/$stage.log"
            if grep -q '^### Error' "$RUNNER_TEMP/$stage.log"; then exit 1; fi
            grep -Eq '"passed":[[:space:]]*true' "$RUNNER_TEMP/$stage.log"
            if [ "$stage" = verify-size-charts-edit ]; then python scripts/verify-size-charts-workbooks.py; fi
            if [ "$stage" = verify-size-charts-units ]; then python scripts/verify-size-charts-unit-workbooks.py; fi
            if [ "$stage" = verify-size-charts-preview-units ]; then python scripts/verify-size-charts-dimension-workbooks.py; fi
          done
          playwright-cli -s=sizechartsci close
  verify:
    # Stable required check: either an exact verified build or every full job.
    if: always()
    needs: [reuse, build, backend, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REUSED: ${{ needs.reuse.outputs.reused }}
      REUSE_RESULT: ${{ needs.reuse.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      BROWSERS_RESULT: ${{ needs.browsers.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Require verified reuse or all verification groups
        run: python .github/ci/reuse_verified.py gate
      - name: Record the tested PR merge tree and immutable build artifact
        if: github.event_name == 'pull_request'
        env:
          FRONTEND_ARTIFACT_ID: ${{ needs.build.outputs.frontend_artifact_id }}
        run: python .github/ci/reuse_verified.py record
      - name: Publish verification receipt after every check passed
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: verified-ci-${{ github.run_attempt }}
          path: verified-ci.json
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[no deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore the verified build from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: verified-frontend
          path: frontend/dist
      - name: Package release without runtime data or secrets
        run: |
          python scripts/security/build_release.py --channel admin --output release.tar.gz
          python scripts/security/build_release.py --channel admin --verify release.tar.gz
      - name: Upload, back up and deploy over verified SSH
        env:
          DEPLOY_HOST: ${{ secrets.SECURITY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SECURITY_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SECURITY_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SECURITY_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          test "$DEPLOY_USER" = gingtto-deploy
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
          trap 'rm -f -- "$RUNNER_TEMP/deploy-key"' EXIT
          opts=(-i "$RUNNER_TEMP/deploy-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/deploy-known-hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15)
          release_id=admin-${{ github.run_id }}-${{ github.run_attempt }}
          stage=/opt/smawell/incoming/$release_id
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; mkdir -p '$stage'"
          scp "${opts[@]}" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$stage/release.tar.gz"
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 '$stage/release.tar.gz' && sudo -n /usr/local/sbin/gingtto-release deploy admin '$release_id'"
